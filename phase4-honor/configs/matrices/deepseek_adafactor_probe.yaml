name: deepseek_adafactor_probe
description: Probe whether the DeepSeek Adafactor low-memory path remains stable beyond a one-step smoke.
base_config: configs/base/causal_lm_debug.yaml
model_profile: configs/model_profiles/deepseek_placeholder.yaml
data_profile: configs/data_profiles/local_fixture.yaml
variants:
  - name: s16_b1_5step_val
    overrides:
      trainer.run_name: deepseek-adafactor-s16-b1-5step-val
      trainer.seq_len: 16
      trainer.batch_size: 1
      trainer.grad_accum_steps: 1
      trainer.max_steps: 5
      trainer.log_every_steps: 1
      trainer.validate_every_steps: 5
      checkpoint.enabled: false
      model.gradient_checkpointing: true
      trainer.mixed_precision: auto
      optimizer.name: adafactor
      optimizer.lr: 0.0001
  - name: s32_b1_3step_val
    overrides:
      trainer.run_name: deepseek-adafactor-s32-b1-3step-val
      trainer.seq_len: 32
      trainer.batch_size: 1
      trainer.grad_accum_steps: 1
      trainer.max_steps: 3
      trainer.log_every_steps: 1
      trainer.validate_every_steps: 3
      checkpoint.enabled: false
      model.gradient_checkpointing: true
      trainer.mixed_precision: auto
      optimizer.name: adafactor
      optimizer.lr: 0.0001
