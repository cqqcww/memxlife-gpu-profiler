profile:
  name: distilgpt2
  family: gpt-style-causal-lm
  expected_memory: small
  caveats:
    - Good first real baseline; fast enough for repeated course-GPU runs.

model:
  name_or_path: distilgpt2
  tokenizer_name:
  from_pretrained: false
  trust_remote_code: false
  gradient_checkpointing: false

trainer_recommendations:
  seq_len: 256
  batch_size: 4
  grad_accum_steps: 1
  mixed_precision: auto
