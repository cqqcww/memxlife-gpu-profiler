metadata:
  name: causal_lm_tinystories_base
  tags: baseline,causal-lm
  notes: Base for small HuggingFace text dataset experiments.

model:
  name_or_path: distilgpt2
  tokenizer_name:
  from_pretrained: false
  trust_remote_code: false
  gradient_checkpointing: false

data:
  dataset_name: roneneldan/TinyStories
  dataset_config:
  dataset_split: train
  text_field: text
  local_text_path:
  cache_dir: data_cache
  use_cache: true
  validation_split: 0.05
  max_samples: 2000
  seed: 1337
  num_workers: 0
  pin_memory: true
  persistent_workers: false

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.01
  betas: 0.9,0.95
  eps: 0.00000001

scheduler:
  name: warmup_cosine
  warmup_steps: 20
  min_lr_ratio: 0.1

trainer:
  run_name: composed-tinystories
  output_dir: runs
  seq_len: 256
  batch_size: 4
  max_steps: 100
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  log_every_steps: 5
  validate_every_steps: 25
  mixed_precision: off
  device: auto
  compile_model: false
  resume_from:

logging:
  tensorboard: true
  jsonl: true
  console: true

checkpoint:
  save_every_steps: 50
  keep_last: 2
  save_rng: true

agent:
  enabled: true
  proposal_mode: true
  ledger_path: runs/ledger.jsonl
